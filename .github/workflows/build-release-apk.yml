name: Build & Release Full APKs

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Build Smartphone APKs
        run: |
          ./gradlew :app:smartphone:assembleRelease :app:smartphone:assembleDebug

      - name: Build TV APKs
        run: |
          ./gradlew :app:tv:assembleRelease :app:tv:assembleDebug

      - name: Copy & Rename APKs for Easy Download
        run: |
          mkdir -p final-apks
          find app/smartphone/build/outputs/apk/ -name "*.apk" -exec cp {} final-apks/ \;
          find app/tv/build/outputs/apk/ -name "*.apk" -exec cp {} final-apks/ \;
          ls -la final-apks/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M3UAndroid-Pro-Full-APKs
          path: final-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: final-apks/*.apk
          name: M3UAndroid Pro Release ${{ github.ref_name }}
          body: |
            ### 🚀 M3UAndroid Pro: Universal IPTV & DLNA Cast Suite
            - Universal DLNA & UPnP casting engine with hardware MulticastLock.
            - Direct Link Quick Caster.
            - In-App Web Video & Live Stream Sniffer.
            - Modern Pro Material 3 Cast Hub.
          draft: false
          prerelease: false
