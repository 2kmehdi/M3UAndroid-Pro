name: Build & Release Full APKs

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Build Smartphone and TV APKs
        run: |
          ./gradlew :app:smartphone:assembleDebug :app:tv:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p final-apks
          find app/ -type f -name "*.apk" -not -path "*/intermediates/*" -exec cp -v {} final-apks/ \; || true
          ls -la final-apks/
          count=$(ls -1 final-apks/*.apk 2>/dev/null | wc -l)
          echo "Total APKs found: $count"
          if [ "$count" -eq 0 ]; then
            echo "Searching all outputs across project:"
            find . -name "*.apk" -exec cp -v {} final-apks/ \; || true
            ls -la final-apks/
          fi

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M3UAndroid-Pro-Full-APKs
          path: final-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        with:
          files: final-apks/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('M3UAndroid Pro Release {0}', github.ref_name) || 'M3UAndroid Pro (Latest APKs)' }}
          body: |
            ### 🚀 M3UAndroid Pro: Universal IPTV & DLNA Cast Suite
            - Universal DLNA & UPnP casting engine with hardware MulticastLock.
            - Direct Link Quick Caster.
            - In-App Web Video & Live Stream Sniffer.
            - Modern Pro Material 3 Cast Hub.
          draft: false
          prerelease: false
